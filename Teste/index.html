<!DOCTYPE html>
<!-- Declaração do tipo de documento como HTML5. Isso informa ao navegador que estamos usando a versão mais recente do HTML. -->

<html lang="pt-BR">
<!-- Define o idioma da página como português do Brasil. Isso ajuda em questões de acessibilidade e SEO. -->

<head>
    <!-- A tag <head> contém metadados e links para recursos externos, como CSS e fontes. -->

    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres como UTF-8, que suporta a maioria dos caracteres especiais e acentos. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Configura a viewport para garantir que o site seja responsivo em dispositivos móveis. -->

    <title>CONECTECH - Soluções em Manutenção e Instalação</title>
    <!-- Define o título da página, que aparece na aba do navegador e nos resultados de busca. -->

    <meta name="description" content="CONECTECH - Soluções em manutenção e instalação elétrica, hidráulica e ar condicionado. Serviços comerciais, residenciais e prediais.">
    <!-- Fornece uma descrição da página para motores de busca e redes sociais. -->

    <meta name="keywords" content="manutenção elétrica, instalação hidráulica, ar condicionado, CONECTECH">
    <!-- Palavras-chave relacionadas ao conteúdo da página para SEO. -->

    <meta property="og:title" content="CONECTECH - Soluções em Manutenção e Instalação">
    <!-- Título que será exibido quando a página for compartilhada em redes sociais. -->

    <meta property="og:description" content="Soluções em manutenção e instalação elétrica, hidráulica e ar condicionado. Serviços comerciais, residenciais e prediais.">
    <!-- Descrição que será exibida quando a página for compartilhada em redes sociais. -->

    <meta property="og:image" content="URL_DA_IMAGEM_AQUI">
    <!-- Imagem que será exibida quando a página for compartilhada em redes sociais. -->

    <meta property="og:url" content="URL_DO_SITE_AQUI">
    <!-- URL da página que será compartilhada em redes sociais. -->

    <link rel="stylesheet" href="styles.css">
    <!-- Link para o arquivo CSS que contém os estilos da página. -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <!-- Importa a fonte Poppins do Google Fonts para ser usada no site. -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Importa o Font Awesome para usar ícones no site. -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <!-- Importa o Lightbox CSS para criar galerias de imagens interativas. -->

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <!-- Importa a biblioteca AOS (Animate On Scroll) para animações ao rolar a página. -->

    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css"/>
    <!-- Importa o Slick Carousel CSS para criar carrosséis de imagens. -->
</head>

<body>
    <!-- O corpo da página, onde todo o conteúdo visível será colocado. -->

    <div class="background-text"></div>
    <!-- Div para o texto de fundo decorativo que aparece atrás do conteúdo. -->

    <!-- Header -->
    <header>
        <!-- Cabeçalho da página, que contém o logo, menu de navegação e botão de orçamento. -->

        <div class="logo">
            <!-- Div que contém o logo da empresa. -->
            <span class="logo-text">CONECTECH</span>
            <!-- Texto do logo. -->
        </div>

        <nav aria-label="Menu principal">
            <!-- Navegação principal da página. -->
            <ul id="nav-links">
                <!-- Lista de links do menu. -->
                <li><a href="#inicio" aria-current="page">Início</a></li>
                <!-- Link para a seção Início. -->
                <li><a href="#servicos">Serviços</a></li>
                <!-- Link para a seção Serviços. -->
                <li><a href="#sobre">Sobre Nós</a></li>
                <!-- Link para a seção Sobre Nós. -->
                <li><a href="#projetos">Projetos</a></li>
                <!-- Link para a seção Projetos. -->
                <li><a href="#contato">Contato</a></li>
                <!-- Link para a seção Contato. -->
            </ul>

            <div class="menu-toggle" id="mobile-menu">
                <!-- Botão de menu para dispositivos móveis. -->
                <span class="bar"></span>
                <!-- Barra do ícone de menu. -->
                <span class="bar"></span>
                <!-- Barra do ícone de menu. -->
                <span class="bar"></span>
                <!-- Barra do ícone de menu. -->
            </div>
        </nav>

        <a href="#contato" class="btn-orcamento">Solicitar Orçamento</a>
        <!-- Botão para solicitar orçamento. -->
    </header>

    <!-- Hero Section -->
    <section id="hero">
        <!-- Seção hero (destaque) da página, com vídeo de fundo e conteúdo centralizado. -->
        <video autoplay muted loop id="hero-video">
            <!-- Vídeo de fundo que se repete automaticamente. -->
            <source src="assets/images/hero-video.mp4" type="video/mp4">
            <!-- Arquivo de vídeo no formato MP4. -->
            <img src="assets/images/hero-fallback.jpg" alt="Fallback Hero Image">
            <!-- Imagem de fallback caso o vídeo não carregue. -->
        </video>

        <div class="hero-content" data-aos="fade-up" data-aos-duration="1000">
            <!-- Conteúdo centralizado na seção hero. -->
            <h1>Soluções em Manutenção e Instalação</h1>
            <!-- Título principal da seção hero. -->
            <p>Elétrica | Hidráulica | Ar Condicionado</p>
            <!-- Subtítulo da seção hero. -->
            <div class="hero-buttons">
                <!-- Div que contém os botões da seção hero. -->
                <a href="#servicos" class="btn"><i class="fas fa-info-circle"></i> Saiba Mais</a>
                <!-- Botão "Saiba Mais" com ícone. -->
                <a href="#contato" class="btn"><i class="fas fa-file-alt"></i> Solicitar Orçamento</a>
                <!-- Botão "Solicitar Orçamento" com ícone. -->
            </div>
        </div>
    </section>
